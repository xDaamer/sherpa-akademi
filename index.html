<!doctype html>
<html lang="tr" class="scroll-smooth">
  <head>
     <!-- Alttaki meta tag google search console tagıdır -->
    <meta name="google-site-verification" content="Ssxcg00RAU5blXZiul7lZCkLq18HeCmS30shOPNqNgw" />
    <!-- Strix site doğrulama tagı. -->
    <meta name="strix-verification" content="strix-verify-4906a7cce2f6a59adda77fbfb6e48ec2" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=6" />
    <!-- Sekme ikonu .ico'dan gelir: 16/32/48/64 girdisi taşıyor ve tarayıcı
         kendi ölçeğine uyanı seçiyor. Aşağıdaki PNG yüksek DPI yedeği; boyut
         beyanı dosyanın GERÇEĞİYLE uyuşmalı, aksi halde tarayıcı onu küçük
         sanıp sekme için indirir. -->
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon.png?v=6" />
    <link rel="shortcut icon" href="/favicon.ico?v=6" />
    <!-- AYRI DOSYA, favicon.png DEĞİL. iOS ana ekran ikonunu yuvarlatıp kendi
         zeminine basar ve SAYDAMLIĞI SİYAHA çevirir; bu dosya bu yüzden alfa
         kanalı hiç olmayan, 180x180'lik opak beyaz bir kare. 512'lik bir
         ikon buraya konursa iOS onu her seferinde indirip küçültür. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=6" />

    <!-- Primary Meta Tags -->
    <title>{{site.title}}</title>
    <meta name="description" content="{{site.description}}" />
    <meta name="author" content="{{site.name}}" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <!-- Kanonik host www'ludur; www'suz adres 308 ile buraya yönlenir. -->
    <link rel="canonical" href="{{site.domain}}/" />

    <!-- Open Graph Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{site.name}}" />
    <meta property="og:url" content="{{site.domain}}/" />
    <meta property="og:title" content="{{site.title}}" />
    <meta property="og:description" content="{{site.description}}" />
    <meta property="og:image" content="{{site.domain}}/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Sherpa Akademi — birebir online özel ders, YKS ve LGS hazırlık" />
    <meta property="og:locale" content="tr_TR" />

    <!-- Twitter Meta Tags (spesifikasyon `name` ister, `property` değil) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="{{site.domain}}/" />
    <meta name="twitter:title" content="{{site.title}}" />
    <meta name="twitter:description" content="{{site.description}}" />
    <meta name="twitter:image" content="{{site.domain}}/og-image.png" />

    <!-- Additional SEO Tags -->
    <meta name="theme-color" content="#191F61" />
    <!-- apple-mobile-web-app-capable kullanımdan kalktı; standart karşılığı
         mobile-web-app-capable. Eski iOS sürümleri için ikisi de bırakıldı. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--
      Font stylesheet'i render'ı bloklamasın: önce `print` olarak indirilir,
      yüklenince `all`a çevrilir. `noscript` yedeği JS kapalıyken devreye girer.
      Ağırlıklar 6'dan 3'e indirildi (400/600/800) — sayfa diğerlerini kullanmıyor.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;600;800&display=swap"
      media="print"
      onload="this.media='all'"
    >
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;600;800&display=swap">
    </noscript>

    <!--
      LCP GÖRSELİ ÖN YÜKLEME
      -------------------------------------------------------------------
      Sayfanın en büyük ögesi hero'daki hoca şeridinin ilk karesidir. Uygulama
      istemci tarafında render edildiği için o <img> etiketi, JS bundle'ı
      çalışana kadar DOM'da yok — tarayıcının preload scanner'ı görseli
      bulamıyor ve indirmeye ~900 ms geç başlıyor. Bu satır görseli HTML
      ayrıştırılırken kuyruğa alır.

      `imagesrcset`/`imagesizes` TeacherTicker'daki srcset/sizes ile BİREBİR
      aynı olmalı — aksi halde tarayıcı ön yüklemede bir dosyayı, render
      sırasında başkasını indirir ve iki kez veri harcanır.

      DİKKAT 1: buradaki dosya adı `public/teachers/config.json` içindeki
      `activeImagesLeft[0]` ile aynı olmalıdır. O listeyi değiştirirseniz
      bu satırı da güncelleyin.

      DİKKAT 2: bu blok ARTIK YALNIZCA ANA SAYFADA. Eskiden index.html tüm
      route'lara servis edildiği için yasal sayfalarda ve 404'te de çalışıyor,
      orada kullanılmıyordu (~21 KB boşa gidiyor, konsolda "preloaded but not
      used" uyarısı çıkıyordu) ve buradaki yorum "prerender'a geçilirse bu
      satır yalnızca ana sayfaya konulmalı" diyordu. O geçiş yapıldı:
      scripts/prerender.ts bu bloğu ana sayfa dışındaki her çıktıdan siliyor.
      Yani burası prerender'ın girdisi — silme işini orada arayın.
    -->
    <link
      rel="preload"
      as="image"
      href="/teachers/dila-800.webp"
      imagesrcset="/teachers/dila-400.webp 400w, /teachers/dila-800.webp 800w"
      imagesizes="(max-width: 767px) 45vw, 200px"
      fetchpriority="high"
    />

    <!-- Sitemap -->
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
  </head>
  <body class="font-sans antialiased text-slate-800 bg-slate-50 selection:bg-[#B6D6CC] selection:text-[#191F61]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
